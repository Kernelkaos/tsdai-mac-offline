# Paths are relative to the project folder.
paths:
  sdxl_base: models/sdxl-base-1.0
  controlnet_canny: models/controlnet-canny-sdxl-1.0
  vae: models/sdxl-vae-fp16-fix
  image_encoder: models/image_encoder
  ip_adapter: models/ip_adapter

inference:
  image_size: 1024
  default_steps: 35
  default_guidance_scale: 5.0
  controlnet_conditioning_scale: 0.35
  control_guidance_end: 0.35
  ip_adapter_scale: 0.80

performance:
  enable_attention_slicing: false  # keep false on M1 Max with 64GB
  enable_vae_tiling: false         # keep false for images up to 1344 px
  preload_model: false             # load on first generation

memory:
  # GPU memory cap as a fraction of what macOS recommends for the GPU
  gpu_memory_limit_ratio: 1.0
  # Refuse to start a generation when less than this much memory is available.
  min_free_memory_gb: 12
