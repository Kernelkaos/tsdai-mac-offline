[project]
name = "ai-image-transformer-mac-offline"
version = "1.0.0"
description = "Offline, Apple Silicon only image transformer using SDXL and ControlNet Canny."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.14"
authors = [{ name = "Kernelkaos" }]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
